services:

  node1:
    image: distributed-library-kv:latest
    container_name: kv-node1
    command:
      - "./kv-server"
      - "-id"
      - "node1"
      - "-port"
      - "50051"
      - "-data"
      - "/app/data"
    environment:
      NODE1_ADDR: "node1:50051"
      NODE2_ADDR: "node2:50052"
      NODE3_ADDR: "node3:50053"
    ports:
      - "50051:50051"
    volumes:
      - node1-data:/app/data
    networks:
      - kv-network

  node2:
    image: distributed-library-kv:latest
    container_name: kv-node2
    command:
      - "./kv-server"
      - "-id"
      - "node2"
      - "-port"
      - "50052"
      - "-data"
      - "/app/data"
    environment:
      NODE1_ADDR: "node1:50051"
      NODE2_ADDR: "node2:50052"
      NODE3_ADDR: "node3:50053"
    ports:
      - "50052:50052"
    volumes:
      - node2-data:/app/data
    networks:
      - kv-network

  node3:
    image: distributed-library-kv:latest
    container_name: kv-node3
    command:
      - "./kv-server"
      - "-id"
      - "node3"
      - "-port"
      - "50053"
      - "-data"
      - "/app/data"
    environment:
      NODE1_ADDR: "node1:50051"
      NODE2_ADDR: "node2:50052"
      NODE3_ADDR: "node3:50053"
    ports:
      - "50053:50053"
    volumes:
      - node3-data:/app/data
    networks:
      - kv-network

networks:
  kv-network:

volumes:
  node1-data:
  node2-data:
  node3-data:
