syntax = "proto3";

package kv;

option go_package = "distributed-library-kv/proto";

service KVService {
    rpc Put(PutRequest) returns (PutResponse);
    rpc Get(GetRequest) returns (GetResponse);
    rpc Delete(DeleteRequest) returns (DeleteResponse);

    // Internal replication operations.
    rpc ReplicatePut(PutRequest) returns (PutResponse);
    rpc ReplicateDelete(DeleteRequest) returns (DeleteResponse);
    
    rpc RequestVote(VoteRequest) returns (VoteResponse);
    rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
    rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
}

message PutRequest {
    string key = 1;
    string value = 2;
}

message PutResponse {
    bool success = 1;
}

message GetRequest {
    string key = 1;
}

message GetResponse {
    string value = 1;
    bool found = 2;
}

message DeleteRequest {
    string key = 1;
}

message DeleteResponse {
    bool success = 1;
}
message VoteRequest {
    int32 term = 1;
    string candidate_id = 2;
}

message VoteResponse {
    int32 term = 1;
    bool vote_granted = 2;
}

message HeartbeatRequest {
    int32 term = 1;
    string leader_id = 2;
}

message HeartbeatResponse {
    int32 term = 1;
    bool success = 2;
}
message LogEntry {
    int32 term = 1;
    string command = 2;
    string key = 3;
    string value = 4;
}

message AppendEntriesRequest {
    int32 term = 1;
    string leader_id = 2;
    repeated LogEntry entries = 3;
    int32 leader_commit = 4;
}

message AppendEntriesResponse {
    int32 term = 1;
    bool success = 2;
}
